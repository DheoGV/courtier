name: Courtier
options:
  bundleIdPrefix: com.dheaph
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Courtier:
    type: application
    platform: iOS
    sources:
      - path: Courtier
    info:
      path: Courtier/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The elegant theme is light-only (ivory, racing green & brass).
        UIUserInterfaceStyle: Light
        # Launch: the Courtier crown on racing green, handed off to SplashView.
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
        # Bundled from Google Fonts (OFL) when present; Typography falls back to system serif/sans otherwise.
        UIAppFonts:
          - PlayfairDisplay.ttf
          - Jost.ttf
          - Marcellus-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dheaph.courtier
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Courtier
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A79CU8U5L7
  CourtierTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CourtierTests
    dependencies:
      - target: Courtier
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dheaph.courtier.tests
